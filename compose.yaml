name: appointment-manager

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    mem_limit: 2g
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}"
      MYSQL_DATABASE: appointment_manager
      MYSQL_USER: appointment_app
      MYSQL_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in .env}"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - 'MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP -h 127.0.0.1 -u "$${MYSQL_USER}" --database="$${MYSQL_DATABASE}" -e "SELECT 1" >/dev/null'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  app:
    build: .
    restart: unless-stopped
    mem_limit: 1g
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DB_URL: "jdbc:mysql://db:3306/appointment_manager?connectionTimeZone=UTC&useSSL=false&allowPublicKeyRetrieval=true"
      DB_USERNAME: appointment_app
      DB_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in .env}"
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql-data: