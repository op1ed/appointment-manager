# 全局阅读第一批：应用运行配置。先读数据库与登录部分，Agent 参数在后续批次展开。
# 配置中的 ${变量名} 从运行环境取得值；${变量名:默认值} 在未设置时使用默认值。
# 服务器由 compose.yaml 把 .env 中的相关值传给 app 容器；凭证保存在运行环境中。

# 应用名称，便于在配置和日志中识别这个服务。
spring.application.name=appointment-manager

# 数据库地址、账号和密码。这三项没有配置默认值，运行环境应提供它们。
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# 表结构由 Flyway 迁移管理，实体通过 MyBatis-Plus 注解映射已有表。
# 下划线列名自动映射为驼峰字段，例如 password_hash → passwordHash。
mybatis-plus.configuration.map-underscore-to-camel-case=true
# 每条 SQL 独立取数，避免事务内行锁查询复用一级缓存中的旧对象。
mybatis-plus.configuration.local-cache-scope=STATEMENT
mybatis-plus.configuration.cache-enabled=false
# 显式更新时也写入 null，确保可空字段的清空操作能够保存。
mybatis-plus.global-config.db-config.update-strategy=always
mybatis-plus.type-handlers-package=com.op1ed.appointmentmanager.shared.persistence.typehandler

# ISO 8601 时长写法：PT24H 表示 24 小时。这是登录令牌的有效期。
app.security.token-ttl=PT24H
# 启动时用于初始化管理员的配置；已有管理员账号后，修改这里不会重置其密码。
app.security.admin-username=${APP_ADMIN_USERNAME:}
app.security.admin-password=${APP_ADMIN_PASSWORD:}

# Agent 生成的动作预览有效期为 5 分钟；用户确认时还会检查有效期和业务条件。
app.agent.action-ttl=PT5M

# 以下是自然语言对话的模型配置：默认关闭，启用后由 DeepSeek 处理模型请求。
# API Key 从环境变量读取；直接使用预约 HTTP 接口和改期 Graph 接口不需要模型调用。
app.agent.deepseek.enabled=${AGENT_ENABLED:false}
app.agent.deepseek.api-key=${DEEPSEEK_API_KEY:}
app.agent.deepseek.model=${DEEPSEEK_MODEL:deepseek-flash}
# 连接最多等待 5 秒；单次模型请求最多等待 25 秒，还受本轮剩余时间预算约束。
app.agent.deepseek.connect-timeout=PT5S
app.agent.deepseek.request-timeout=PT25S
# 单次模型生成 token 上限；token 是模型计量文本的单位，与字符数不同。
app.agent.deepseek.max-tokens=2048
# 一轮 Agent 对话可以包含多次模型请求、工具调用，分别限制为最多 6 次和 8 次。
app.agent.chat.max-model-calls=6
app.agent.chat.max-tool-calls=8
# 本应用实例同时处理的对话上限；同一账号最多同时处理一条消息的规则另在代码中实现。
app.agent.chat.max-concurrent-requests=4
# 上下文与查询结果的大小上限，单位是序列化后的字符数，用于控制发送给模型的数据量。
app.agent.chat.max-context-chars=60000
app.agent.chat.max-tool-result-chars=24000
# 一轮模型与工具执行的时间预算；解释“今天、明天”时使用下面的默认用户时区。
app.agent.chat.timeout=PT90S
app.agent.chat.zone-id=Asia/Shanghai
