spring.application.name=appointment-manager

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

app.security.token-ttl=PT24H
app.security.admin-username=${APP_ADMIN_USERNAME:}
app.security.admin-password=${APP_ADMIN_PASSWORD:}

app.agent.action-ttl=PT5M

app.agent.deepseek.enabled=${AGENT_ENABLED:false}
app.agent.deepseek.api-key=${DEEPSEEK_API_KEY:}
app.agent.deepseek.model=${DEEPSEEK_MODEL:deepseek-flash}
app.agent.deepseek.connect-timeout=PT5S
app.agent.deepseek.request-timeout=PT25S
app.agent.deepseek.max-tokens=2048
app.agent.chat.max-model-calls=6
app.agent.chat.max-tool-calls=8
app.agent.chat.max-concurrent-requests=4
app.agent.chat.max-context-chars=60000
app.agent.chat.max-tool-result-chars=24000
app.agent.chat.timeout=PT90S
app.agent.chat.zone-id=Asia/Shanghai
